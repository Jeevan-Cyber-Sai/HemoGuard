<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HemoGuard | Bed 4</title>
<style>
  :root {
    --bg:      #080c14;
    --card:    #0d1220;
    --edge:    #1a2035;
    --text:    #e8edf5;
    --muted:   #4a5568;
    --green:   #00e676;
    --amber:   #ffab00;
    --red:     #ff1744;
    --blue:    #2979ff;

    --triage:  var(--muted);   /* until the first payload names a band */

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: 56px 1fr 1fr 74px 1.45fr;
    gap: 9px;
    padding: 9px;
  }

  /* ---------- shared card shell ---------- */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--edge);
    border-top: 2px solid var(--triage);
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    transition: border-top-color .6s ease, opacity .3s;
  }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .readout {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: auto;
  }
  .value {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(34px, 5.6vw, 78px);
    line-height: .95;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }
  .value.mid { font-size: clamp(28px, 4vw, 56px); }
  .unit {
    font-family: var(--mono);
    font-size: clamp(12px, 1.25vw, 19px);
    color: var(--muted);
  }

  /* 2. value update flash - holds the edge tint ~100ms, then settles back.
     Deliberately below the threshold of a colour "change"; it reads as the
     card having twitched, not as a state having changed. */
  @keyframes cardflash {
    0%, 28% { background: var(--edge); }
    100%    { background: var(--card); }
  }
  .card.flash { animation: cardflash 350ms ease-out; }

  /* ---------- header ---------- */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 0 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 4px;
  }
  .brand em { font-style: normal; color: var(--triage); transition: color .6s ease; }

  /* 1. pulse dot - colour tracks the triage band, halts when degraded */
  .dot {
    position: relative;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--triage);
    flex: none;
    transition: background .6s ease;
  }
  .dot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: inherit;
    animation: ping 1s ease-out infinite;
  }
  @keyframes ping {
    0%   { transform: scale(1);   opacity: .85; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  body.degraded .dot::after { animation: none; }

  .centre {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .bed {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .clock {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .badge {
    justify-self: end;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.4px;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--green);
    color: var(--green);
    transition: color .3s, border-color .3s;
  }
  /* 7. degraded -> the badge stops claiming anything */
  body.degraded .badge { border-color: var(--muted); color: var(--muted); }

  /* ---------- rows ---------- */
  .row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    min-height: 0;
  }

  /* ---------- 4. ECG strip on the pulse card ---------- */
  .ecg {
    margin-top: 10px;
    height: 34px;
    flex: none;
    overflow: hidden;
  }
  .ecg svg { width: 100%; height: 100%; display: block; }
  .ecg .trace {
    fill: none;
    stroke: var(--green);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ecg .scroll { animation: sweep var(--ecg-period, 3.2s) linear infinite; }
  @keyframes sweep { to { transform: translateX(-400px); } }
  /* No pulse data means no rhythm to draw. A flat line is the honest figure. */
  .ecg.flat .scroll { display: none; }
  .ecg .baseline { display: none; }
  .ecg.flat .baseline { display: block; stroke: var(--muted); }
  body.degraded .ecg .scroll { animation-play-state: paused; }

  /* ---------- 5. z-risk gauge ---------- */
  .gauge-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    margin-top: 4px;
    display: grid;
    place-items: end center;
  }
  .gauge-wrap svg { width: 100%; height: 100%; max-height: 118px; display: block; }
  .gauge-track { stroke: var(--edge); }
  .gauge-fill  { transition: stroke-dashoffset .4s ease, stroke .4s ease; }
  #needle {
    transform-origin: 100px 96px;
    transition: transform .4s ease;
  }
  #needle line { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
  #needle circle { fill: var(--text); }
  .gauge-num {
    position: absolute;
    left: 50%;
    bottom: -2px;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(22px, 2.7vw, 38px);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .gauge-ends {
    position: absolute; inset: 0;
    pointer-events: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .gauge-ends b { position: absolute; bottom: 4px; font-weight: 400; }
  .gauge-ends b.lo { left: 2%; }
  .gauge-ends b.hi { right: 2%; }

  /* ---------- 3. triage bar ---------- */
  .triage {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--card);
    border: 1px solid var(--edge);
    border-left: 4px solid var(--triage);
    border-radius: 6px;
    padding: 0 20px;
    box-shadow: 0 1px 10px rgba(0, 0, 0, .45);
    transition: border-left-color .6s ease;
    overflow: hidden;
  }
  .triage .label { font-size: 10px; }
  .triage-text {
    font-family: var(--mono);
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--triage);
    transition: color .6s ease;
  }
  /* Critical breathes until acknowledged - motion is what carries across a
     ward, and it is the one thing acknowledgement is allowed to stop. */
  @keyframes breathe { 50% { opacity: .7; } }
  .triage.critical { animation: breathe 1.5s ease-in-out infinite; }

  #ack {
    margin-left: auto;
    display: none;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 11px 26px;
    border-radius: 4px;
    border: 1px solid var(--red);
    background: transparent;
    color: var(--red);
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  #ack:hover { background: var(--red); color: #fff; }
  #ack.visible { display: block; }
  .ack-note {
    margin-left: auto;
    display: none;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .ack-note.visible { display: block; }

  /* ---------- bottom ---------- */
  .bottom {
    display: grid;
    grid-template-columns: minmax(230px, 1fr) 2.7fr;
    gap: 9px;
    min-height: 0;
  }
  .chan-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 14px;
    margin-top: 10px;
  }
  .chan {
    display: flex;
    align-items: baseline;
    gap: 7px;
    font-family: var(--mono);
    font-size: clamp(13px, 1.35vw, 20px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chan i {
    font-style: normal;
    font-size: 11px;
    color: var(--muted);
    width: 9px;
    flex: none;
  }

  /* 8. optical tile */
  .optical-foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .swatch {
    width: 30px; height: 30px;
    border-radius: 4px;
    border: 1px solid var(--edge);
    background: var(--bg);
    flex: none;
    transition: background .3s ease;
  }
  .hex {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  .led-pill {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.6px;
    padding: 5px 13px;
    border-radius: 999px;
    border: 1px solid var(--muted);
    color: var(--muted);
    transition: color .3s, border-color .3s;
  }

  /* 6. sparklines */
  .spark-stack {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 9px;
    min-height: 0;
  }
  .spark-card { padding: 9px 13px; }
  .spark-head { display: flex; justify-content: space-between; align-items: baseline; }
  .spark-head .rng {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  canvas { width: 100%; flex: 1; min-height: 0; display: block; margin-top: 6px; }

  /* ---------- not-fitted channels ----------
     A sensor this node does not carry must not read as a sensor reporting
     zero. The card holds its place so the layout is stable once it is wired
     in, but states plainly that nothing is behind it. */
  .card.absent { border-top-color: var(--edge); }
  .card.absent .readout { opacity: .28; }
  .card.absent::before {
    content: "NOT FITTED";
    position: absolute;
    right: 13px;
    top: 11px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--muted);
  }

  /* ---------- 7. degraded / stale ---------- */
  body.degraded .card,
  body.degraded .triage { opacity: .45; }
  body.degraded .triage { animation: none; }
  body.degraded .card.absent::before { display: none; }
  body.degraded .card::after {
    content: var(--stale-label, "STALE");
    position: absolute;
    right: 10px;
    bottom: 6px;
    font-family: var(--mono);
    font-size: clamp(13px, 1.4vw, 22px);
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--edge);
    transform: rotate(-8deg);
    pointer-events: none;
  }

  /* ---------- critical flash ---------- */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--red);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
  }
  #flash.on { animation: flashover 2s infinite; }
  @keyframes flashover {
    0%, 100% { opacity: 0; }
    8%       { opacity: .3; }
    22%      { opacity: 0; }
  }

  /* ---------- audio gate ---------- */
  #audio-gate {
    position: fixed;
    left: 50%; bottom: 14px;
    transform: translateX(-50%);
    z-index: 10000;
    display: none;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--amber);
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 13px;
    letter-spacing: .5px;
    color: var(--amber);
    cursor: pointer;
  }
  #audio-gate.visible { display: flex; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><i class="dot"></i>HEMO<em>GUARD</em></div>
    <div class="centre">
      <div class="bed">BED 4</div>
      <div class="clock" id="clock">—:—:—</div>
    </div>
    <div class="badge" id="badge-text">—</div>
  </header>

  <!-- primary vitals -->
  <div class="row">
    <div class="card" id="card-weight">
      <div class="label">Weight</div>
      <div class="readout"><span class="value" id="weight">—</span><span class="unit">g</span></div>
    </div>
    <div class="card" id="card-spo2">
      <div class="label">SpO&#8322;</div>
      <div class="readout"><span class="value" id="spo2">—</span><span class="unit">%</span></div>
    </div>
    <div class="card" id="card-pulse">
      <div class="label">Pulse Rate</div>
      <div class="readout"><span class="value" id="pulse">—</span><span class="unit">bpm</span></div>
      <div class="ecg flat" id="ecg">
        <svg viewBox="0 0 400 40" preserveAspectRatio="none">
          <defs>
            <path id="beat" class="trace"
                  d="M0,20 H30 L34,20 L38,7 L44,33 L48,20 H54 L60,15 L66,20 H100"/>
          </defs>
          <line class="trace baseline" x1="0" y1="20" x2="400" y2="20"/>
          <g class="scroll">
            <use href="#beat" x="0"/><use href="#beat" x="100"/>
            <use href="#beat" x="200"/><use href="#beat" x="300"/>
            <use href="#beat" x="400"/><use href="#beat" x="500"/>
            <use href="#beat" x="600"/><use href="#beat" x="700"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- derived metrics -->
  <div class="row">
    <div class="card" id="card-rate">
      <div class="label">Bleeding Rate</div>
      <div class="readout"><span class="value mid" id="rate">—</span><span class="unit">mL/min</span></div>
    </div>
    <div class="card" id="card-hb">
      <div class="label">Hb Ratio</div>
      <div class="readout"><span class="value mid" id="hb">—</span></div>
    </div>
    <div class="card" id="card-zrisk">
      <div class="label">Z-Risk</div>
      <div class="gauge-wrap">
        <svg viewBox="0 0 200 108" preserveAspectRatio="xMidYMax meet">
          <path class="gauge-track" d="M 18 96 A 82 82 0 0 1 182 96"
                fill="none" stroke-width="13" stroke-linecap="round"/>
          <path class="gauge-fill" id="gauge" d="M 18 96 A 82 82 0 0 1 182 96"
                fill="none" stroke-width="13" stroke-linecap="round"/>
          <g id="needle">
            <line x1="100" y1="96" x2="100" y2="34"/>
            <circle cx="100" cy="96" r="4.5"/>
          </g>
        </svg>
        <div class="gauge-ends"><b class="lo">0</b><b class="hi">15+</b></div>
        <div class="gauge-num" id="zrisk">—</div>
      </div>
    </div>
  </div>

  <!-- triage -->
  <div class="triage" id="triage-bar">
    <div class="label">Triage Band</div>
    <div class="triage-text" id="triage-text">—</div>
    <button id="ack">ACKNOWLEDGE</button>
    <div class="ack-note" id="ack-note">ACKNOWLEDGED</div>
  </div>

  <!-- optical + trends -->
  <div class="bottom">
    <div class="card" id="card-optical">
      <div class="label">Optical Sensor</div>
      <div class="chan-grid">
        <div class="chan"><i>R</i><span id="ch-r">—</span></div>
        <div class="chan"><i>G</i><span id="ch-g">—</span></div>
        <div class="chan"><i>B</i><span id="ch-b">—</span></div>
        <div class="chan"><i>C</i><span id="ch-c">—</span></div>
      </div>
      <div class="optical-foot">
        <i class="swatch" id="swatch"></i>
        <span class="hex" id="colour-hex">—</span>
        <span class="led-pill" id="led">—</span>
      </div>
    </div>

    <div class="spark-stack">
      <div class="card spark-card">
        <div class="spark-head">
          <div class="label">Weight Trend &mdash; 60 pts</div>
          <div class="rng" id="w-range">—</div>
        </div>
        <canvas id="spark-weight"></canvas>
      </div>
      <div class="card spark-card">
        <div class="spark-head">
          <div class="label">Z-Risk Trend &mdash; 60 pts</div>
          <div class="rng">0 &ndash; 15</div>
        </div>
        <canvas id="spark-zrisk"></canvas>
      </div>
    </div>
  </div>

</div>

<div id="flash"></div>
<div id="audio-gate">Click anywhere to enable alarm audio</div>

<script>
"use strict";

/* ------------------------------------------------------------------
   config
------------------------------------------------------------------ */
// Opened over file:// the hostname is empty, so fall back to localhost.
const HOST      = location.hostname || "localhost";
const WS_URL    = `ws://${HOST}:8000/ws`;
const API_URL   = `http://${HOST}:8000`;
const RETRY_MS  = 3000;
const MAX_POINTS = 60;
const GAUGE_CAP  = 15;          // visual clip only; the label shows the true value
const ARC_LENGTH = Math.PI * 82; // radius 82 semicircle

const COLOURS = { green: "#00e676", amber: "#ffab00", red: "#ff1744",
                  unknown: "#4a5568" };
const TRIAGE_TEXT = { green: "LOW", amber: "WATCH", red: "CRITICAL",
                      unknown: "NO DATA" };

// Statuses that mean "what is on screen is not a live measurement". The node
// reports sensor_invalid while the backend is still replaying the last good
// scores, and sensor_fault once it has given up on them. "waiting" belongs
// here too: on a freshly started backend no reading has arrived yet, and a
// LIVE badge over a dashboard that has never seen the node is the exact
// failure this table exists to prevent.
const DEGRADED = { stale: "STALE", offline: "OFFLINE", waiting: "WAITING",
                   sensor_invalid: "SENSOR", sensor_fault: "SENSOR FAULT" };

const DASH = "—";

/* ------------------------------------------------------------------
   state
------------------------------------------------------------------ */
let socket = null;
let retryTimer = null;
// Starts null, not "green": nothing has been measured yet, so the first
// payload must always count as a change and paint the band for the first time.
let currentTriage = null;
let acknowledged = false;
let alarmRunning = false;
let lastPlotted = null;   // timestamp of the last reading added to the trends
const weightHistory = [];
const zriskHistory = [];

const $ = (id) => document.getElementById(id);

/* ------------------------------------------------------------------
   audio  (Web Audio API only - no files)
------------------------------------------------------------------ */
let audioCtx = null;
let alarmTimer = null;

function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// Browsers block audio until the user interacts with the page. Show a prompt
// while that is still true so a silent alarm is never mistaken for no alarm.
function audioBlocked() {
  return !audioCtx || audioCtx.state !== "running";
}
function refreshAudioGate() {
  $("audio-gate").classList.toggle("visible", audioBlocked());
}

function beep(freq, type, ms, peak) {
  const ctx = ensureAudio();
  if (!ctx || ctx.state !== "running") return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const now = ctx.currentTime;
  const dur = ms / 1000;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(peak, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}

// Soft chime: 880 Hz sine, 200 ms, fades out.
function chime() { beep(880, "sine", 200, 0.16); }

// Alarm: 440 Hz square, 500 ms on / 300 ms off, looping.
function startAlarm() {
  if (alarmRunning) return;
  alarmRunning = true;
  const fire = () => beep(440, "square", 500, 0.22);
  fire();
  alarmTimer = setInterval(fire, 800);
}
function stopAlarm() {
  alarmRunning = false;
  if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
}

function unlockAudio() {
  ensureAudio();
  refreshAudioGate();
  // If we went critical before audio was permitted, start the alarm now.
  if (currentTriage === "red" && !acknowledged && !alarmRunning) startAlarm();
}
["click", "keydown", "touchstart"].forEach((evt) =>
  document.addEventListener(evt, unlockAudio, { passive: true })
);

/* ------------------------------------------------------------------
   alerts
------------------------------------------------------------------ */
function applyTriage(triage) {
  const band = COLOURS[triage] ? triage : "green";
  const changed = band !== currentTriage;

  if (changed) {
    document.documentElement.style.setProperty("--triage", COLOURS[band]);
    $("triage-text").textContent = TRIAGE_TEXT[band];

    // Leaving critical clears the acknowledgement, so the next escalation alarms.
    if (currentTriage === "red" && band !== "red") acknowledged = false;
    if (band === "amber") chime();
    currentTriage = band;
  }

  const critical = band === "red";
  const alarming = critical && !acknowledged;

  if (alarming) startAlarm(); else stopAlarm();
  $("flash").classList.toggle("on", alarming);
  $("triage-bar").classList.toggle("critical", alarming);
  // The button is offered only while critical and not yet acknowledged.
  $("ack").classList.toggle("visible", critical && !acknowledged);
  $("ack-note").classList.toggle("visible", critical && acknowledged);

  if (critical) refreshAudioGate(); else $("audio-gate").classList.remove("visible");
}

$("ack").addEventListener("click", (e) => {
  e.stopPropagation();
  acknowledged = true;      // silences sound + flash; red colour stays
  stopAlarm();
  $("flash").classList.remove("on");
  $("triage-bar").classList.remove("critical");
  $("ack").classList.remove("visible");
  $("ack-note").classList.add("visible");
});

/* ------------------------------------------------------------------
   sparklines
------------------------------------------------------------------ */
function sizeCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return null;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr;
    canvas.height = h * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function drawSpark(canvas, data, opts) {
  const sized = sizeCanvas(canvas);
  if (!sized) return;
  const { ctx, w, h } = sized;
  const pad = 4;

  ctx.clearRect(0, 0, w, h);

  // baseline grid
  ctx.strokeStyle = "#1a2035";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = Math.round(pad + ((h - pad * 2) * i) / 4) + 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  if (data.length < 2) return;

  let lo, hi;
  if (opts.fixed) {
    lo = opts.min; hi = opts.max;
  } else {
    lo = Math.min(...data); hi = Math.max(...data);
    if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }   // flat line sits mid-card
    const margin = (hi - lo) * 0.12;
    lo -= margin; hi += margin;
  }

  const span = hi - lo || 1;
  // Anchor to MAX_POINTS so the trace grows in from the left instead of
  // rescaling horizontally on every reading.
  const stepX = (w - pad * 2) / (MAX_POINTS - 1);
  const pt = (v, i) => [
    pad + i * stepX,
    pad + (h - pad * 2) * (1 - Math.min(1, Math.max(0, (v - lo) / span))),
  ];

  // Smoothed trace: quadratic segments through the midpoint of each pair, so
  // the curve stays inside the data's envelope. A spline that overshoots would
  // draw a peak the sensor never measured.
  const points = data.map((v, i) => pt(v, i));
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length - 1; i++) {
    const [cx, cy] = points[i];
    const [nx, ny] = points[i + 1];
    ctx.quadraticCurveTo(cx, cy, (cx + nx) / 2, (cy + ny) / 2);
  }
  const last = points[points.length - 1];
  ctx.lineTo(last[0], last[1]);
  ctx.strokeStyle = opts.colour;
  ctx.lineWidth = 1.6;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.stroke();

  // head marker
  ctx.beginPath();
  ctx.arc(last[0], last[1], 2.6, 0, Math.PI * 2);
  ctx.fillStyle = opts.colour;
  ctx.fill();
}

function redrawSparks() {
  drawSpark($("spark-weight"), weightHistory, { colour: "#2979ff" });
  drawSpark($("spark-zrisk"), zriskHistory, {
    colour: COLOURS[currentTriage] || COLOURS.unknown,
    fixed: true, min: 0, max: GAUGE_CAP,
  });
  if (weightHistory.length) {
    const lo = Math.min(...weightHistory), hi = Math.max(...weightHistory);
    $("w-range").textContent = `${lo.toFixed(1)} – ${hi.toFixed(1)} g`;
  }
}
window.addEventListener("resize", redrawSparks);

/* ------------------------------------------------------------------
   rendering
------------------------------------------------------------------ */
const num = (v, dp, fallback) =>
  (v === null || v === undefined || Number.isNaN(Number(v)))
    ? fallback
    : Number(v).toFixed(dp);

// Writes a value and, when it actually changed, ticks the card it lives in.
// Comparing first keeps the flash meaningful: a feed repeating the same number
// every second would otherwise strobe continuously.
function setValue(id, text) {
  const el = $(id);
  if (!el || el.textContent === text) return;
  el.textContent = text;
  const card = el.closest(".card");
  if (!card) return;
  card.classList.remove("flash");
  void card.offsetWidth;          // reflow, so the animation restarts
  card.classList.add("flash");
}

function setGauge(z) {
  // z_risk is null once the backend stops vouching for the held scores. An
  // empty arc reading "—" is honest; 0.00 would read as a reassuring result.
  const known = z !== null && z !== undefined && !Number.isNaN(Number(z));
  const value = known ? Number(z) : 0;
  const frac = known ? Math.min(1, Math.max(0, value / GAUGE_CAP)) : 0;

  const tint = !known ? COLOURS.unknown
             : value >= 2.5 ? COLOURS.red
             : value >= 1.0 ? COLOURS.amber
             : COLOURS.green;

  $("gauge").style.strokeDasharray = ARC_LENGTH;
  $("gauge").style.strokeDashoffset = ARC_LENGTH * (1 - frac);
  $("gauge").style.stroke = tint;
  // -90deg points the needle at the 0 end, +90deg at 15+.
  $("needle").style.transform = `rotate(${frac * 180 - 90}deg)`;
  setValue("zrisk", known ? value.toFixed(2) : DASH);   // true value, uncapped
}

function render(payload) {
  if (!payload || typeof payload !== "object") return;

  // Anything the backend does not call "live" is held or absent data, however
  // it got that way. Rendering it under a LIVE badge is the one failure this
  // dashboard must never have.
  const degraded = DEGRADED[payload.status] || null;
  const stale = degraded !== null;
  document.body.classList.toggle("degraded", stale);
  document.body.style.setProperty("--stale-label", `"${degraded || "STALE"}"`);
  $("badge-text").textContent = degraded || "LIVE";

  if (payload.weight !== undefined) setValue("weight", num(payload.weight, 1, DASH));
  if (payload.spo2 !== undefined)   setValue("spo2",   num(payload.spo2, 0, DASH));
  if (payload.pulse !== undefined)  setValue("pulse",  num(payload.pulse, 0, DASH));
  if (payload.bleeding_rate !== undefined) setValue("rate", num(payload.bleeding_rate, 1, DASH));
  if (payload.hb_ratio !== undefined)      setValue("hb",   num(payload.hb_ratio, 2, DASH));

  // ECG rhythm is driven by the reported pulse: four beats per sweep, so the
  // strip scrolls at the rate the patient is actually beating. No pulse, no
  // rhythm - the strip flatlines rather than inventing one.
  const bpm = Number(payload.pulse);
  const beating = Number.isFinite(bpm) && bpm > 0;
  $("ecg").classList.toggle("flat", !beating);
  if (beating) {
    $("ecg").style.setProperty("--ecg-period", `${(4 * 60) / bpm}s`);
  }

  // scored_channels lists what the node actually reported this frame, so a
  // sensor that is not fitted reads as unpopulated rather than as a healthy
  // zero. "rate" covers the load cell, which feeds both weight and rate.
  if (Array.isArray(payload.scored_channels)) {
    const has = (ch) => payload.scored_channels.includes(ch);
    $("card-weight").classList.toggle("absent", !has("rate"));
    $("card-rate").classList.toggle("absent", !has("rate"));
    $("card-spo2").classList.toggle("absent", !has("spo2"));
    $("card-pulse").classList.toggle("absent", !has("pr"));
    $("card-hb").classList.toggle("absent", !has("hb"));
  }

  if (payload.red !== undefined)   setValue("ch-r", num(payload.red, 0, DASH));
  if (payload.green !== undefined) setValue("ch-g", num(payload.green, 0, DASH));
  if (payload.blue !== undefined)  setValue("ch-b", num(payload.blue, 0, DASH));
  if (payload.clear !== undefined) setValue("ch-c", num(payload.clear, 0, DASH));

  if (payload.led !== undefined && payload.led !== null) {
    const led = $("led");
    led.textContent = String(payload.led);
    const known = { RED: COLOURS.red, GREEN: COLOURS.green, IR: "#7c4dff" };
    const tint = known[String(payload.led).toUpperCase()] || COLOURS.unknown;
    led.style.borderColor = tint;
    led.style.color = tint;
  }

  // The node sends clear-normalised 0-255 values purely so the ward can see
  // the colour; scoring uses the raw counts above.
  if (payload.hex) {
    $("swatch").style.background = payload.hex;
    $("colour-hex").textContent = payload.hex;
  } else if (typeof payload.norm_r === "number") {
    const hex = "#" + [payload.norm_r, payload.norm_g, payload.norm_b]
      .map((v) => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0"))
      .join("").toUpperCase();
    $("swatch").style.background = hex;
    $("colour-hex").textContent = hex;
  }

  if (payload.z_risk !== undefined) setGauge(payload.z_risk);
  if (payload.triage) applyTriage(payload.triage);

  // Plot each reading once. A stale repeat re-sends the last reading, and the
  // REST pre-populate is immediately echoed by the WebSocket priming frame -
  // both would otherwise duplicate a point in the trends.
  const fresh = payload.timestamp && payload.timestamp !== lastPlotted;
  if (!stale && payload.status === "live" && fresh) {
    lastPlotted = payload.timestamp;
    if (typeof payload.weight === "number") {
      weightHistory.push(payload.weight);
      if (weightHistory.length > MAX_POINTS) weightHistory.shift();
    }
    if (typeof payload.z_risk === "number") {
      zriskHistory.push(payload.z_risk);
      if (zriskHistory.length > MAX_POINTS) zriskHistory.shift();
    }
  }
  redrawSparks();
}

/* ------------------------------------------------------------------
   transport
------------------------------------------------------------------ */
async function primeFromRest() {
  try {
    const res = await fetch(`${API_URL}/latest`, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.status !== "waiting") render(data);
  } catch (err) {
    // Backend down, or CORS refused it - the WebSocket is the real feed anyway.
    console.warn("prime failed:", err.message);
  }
}

function markOffline() {
  document.body.classList.add("degraded");
  document.body.style.setProperty("--stale-label", '"OFFLINE"');
  $("badge-text").textContent = "OFFLINE";
}

function connect() {
  clearTimeout(retryTimer);
  try {
    socket = new WebSocket(WS_URL);
  } catch (err) {
    retryTimer = setTimeout(connect, RETRY_MS);
    return;
  }

  socket.addEventListener("open", () => {
    $("badge-text").textContent = "LIVE";
    document.body.classList.remove("degraded");
  });

  socket.addEventListener("message", (evt) => {
    try { render(JSON.parse(evt.data)); }
    catch (err) { console.warn("bad frame:", err.message); }
  });

  socket.addEventListener("close", () => {
    markOffline();
    retryTimer = setTimeout(connect, RETRY_MS);   // retry every 3 s
  });

  socket.addEventListener("error", () => {
    try { socket.close(); } catch (e) { /* close() triggers the retry */ }
  });
}

/* ------------------------------------------------------------------
   boot
------------------------------------------------------------------ */
setInterval(() => {
  $("clock").textContent = new Date().toLocaleTimeString("en-GB");
}, 1000);

redrawSparks();
primeFromRest().finally(connect);

// Exposed so the payload can be exercised without a backend attached.
window.hemoguard = {
  render,
  state: () => ({ triage: currentTriage, acknowledged, alarmRunning,
                  points: weightHistory.length }),
};
</script>
</body>
</html>
